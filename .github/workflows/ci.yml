name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: verify formatting
        run: test -z "$(gofmt -l .)"

      - name: tidy is up to date
        run: go mod tidy -diff

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: |
          go test ./... -race
          go test ./... -cover

      - name: dead code
        run: |
          out=$(go run golang.org/x/tools/cmd/deadcode@latest -test ./...)
          if [ -n "$out" ]; then echo "$out"; echo "codigo morto encontrado"; exit 1; fi

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: build image
        run: docker build -t tilapou:ci .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
