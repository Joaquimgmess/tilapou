# Bioflocos e recirculacao controlam a agua: a estacao nao entra, e por isso o ciclo
# fecha mais rapido. A renovacao alta e o que sustenta a densidade: a 20% qualquer
# lotacao acima de 3,6 kg/m3 sufoca, o que mata o proposito do tanque.
[[tanques]]
tipo = "bioflocos"
volume_litros = 150000
densidade_max_peixes_m3 = 80
renovacao_por_hora_pct = 100.0
multiplicador_temperatura = 1.25
custo_base_centavos = 3500000
manutencao_centavos_dia = 6000
[[tanques]]
tipo = "recirculacao"
volume_litros = 150000
densidade_max_peixes_m3 = 200
renovacao_por_hora_pct = 100.0
multiplicador_temperatura = 1.40
custo_base_centavos = 9000000
manutencao_centavos_dia = 9000

# O mercado oscila sozinho e o preco por quilo depende da classe de peso:
# peixe maior rende mais por quilo (rendimento de file), ate a classe de excesso.
# Equivalencia peixe-racao = preco / (CAA x preco_racao): <1,25 inviavel, >2,00 excelente.
# A CAA efetiva do ciclo e 2,06 e nao os 1,6 de referencia, porque a racao de manutencao
# corre todo dia: a 900 c/kg o custo medido era 941 e todo tanque dava prejuizo.
[mercado]
peixe_base_centavos_kg = 1150
racao_base_centavos_kg = 320
oscilacao_peixe_pct = 22.0
oscilacao_racao_pct = 14.0
periodo_dias = 21
semente = 20260815
equivalencia_viavel = 1.25

[[mercado.classes]]
