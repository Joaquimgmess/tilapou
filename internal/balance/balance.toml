preco_pct = 100.0
[[mercado.classes]]
ate_peso_mg = 1100000
preco_pct = 112.0
[[mercado.classes]]
ate_peso_mg = 2000000
preco_pct = 94.0

# Emprestimo para financiar automacao: juros correm todo dia sobre o saldo.
[credito]
limite_centavos = 1500000
# A 0,45%/dia o limite cheio cobrava 1.926.000 c de juros nos 184 dias ate a primeira
# despesca, contra 1.050.797 de margem do ciclo: financiar o alevino era negativo por
# construcao, e a fazenda ficava ~210 dias de jogo sem nenhuma acao util. A 0,10% o juro
# fica em 29% da margem e ainda custa mais que a manutencao do viveiro.
juros_dia_pct = 0.10
# Passando deste multiplo do limite o juro sozinho supera qualquer ciclo: a fazenda
# quebra em vez de ficar centenas de dias sem nenhuma acao que melhore alguma coisa.
falencia_multiplo_do_limite = 3.0

# Estreptococose acima de 27 C, francisellose abaixo de 25 C: calendarios opostos.
# A lotacao aumenta o risco de surto.
[choques]
checagem_dias = 5
# Tratar salva o lote agora, mas o antibiotico deixa portadores que atingem o lote seguinte.
tratamento_centavos = 90000
portador_dias = 120
portador_risco_pct = 260.0

# Tudo em centavos de TC. Uma despesca de 2000 peixes de 800 g rende ~14.400 TC,
# entao comedouro (1.200) e aerador (2.500) cabem no primeiro ciclo e o peao (8.000) no segundo.
# CEPEA fev/2026: R$ 8,69-10,39/kg na fazenda. Racao e 64-80% do custo.
# Equivalencia peixe-racao = preco / (CAA * preco_racao): <1,25 inviavel, >2,00 excelente.
[economia]
custo_alevino_centavos = 80
caa_referencia = 1.6
manutencao_pct_biomassa_dia = 0.35
custo_energia_aerador_centavos_hora = 120

# Escada classica: custo base * fator^n sobre o total de tanques. A 1.15 o 30o tanque
# custa 66x a base e a fazenda para de crescer em ~25 dos 64 que o estado reserva; a 1.12
# custa 30x. A receita cresce linear com o numero de tanques, o custo cresce exponencial.
[progressao]
# Sem peixe que valha despesca e sem caixa para um saco de racao, nada que o jogador faca
# reverte: a fazenda quebra por falta de acao possivel, e nao por tamanho da divida, que
# cresce devagar demais para servir de resgate.
dias_sem_saida_para_falencia = 3
fator_custo = 1.12
prestigio_divisor = 1000000
prestigio_bonus_por_unidade_pct = 5.0
contrato_bonus_pct = 25.0
reinicio_caixa_centavos = 50000
reinicio_peixes = 2000
reinicio_racao_kg = 200

