version = 1

# 1 segundo real = 60 segundos de jogo. Consequencias:
#   ciclo dia/noite = 24 min reais (a madrugada critica volta nessa cadencia)
#   engorda de 140 dias = ~2,3 dias reais
#   8h offline = 20 dias de jogo
[tempo]
tick_segundos_de_jogo = 60
compressao = 60

# Oreochromis niloticus.
# ganho_dia = [(raiz3(W) + tgc*t_ref)^3 - W] * mult(temperatura) * (1 - W/peso_maximo)
# Calibrado contra dados de campo (validado em teste):
#   140 d a 22 C -> 44 g   (medido 49)
#   140 d a 30 C -> 389 g  (medido 398)
#   GPD a 28 C: 0,66 (10 g), 2,80 (100 g), 4,93 (400 g), 3,35 (800 g)
#   ciclo 30 g -> 800 g: 199 d a 28 C, 185 d a 30 C, 516 d a 22 C, inviavel abaixo de 20 C
[crescimento]
tgc = 0.0014
temperatura_referencia_c = 26.0
peso_maximo_mg = 1100000
peso_alevino_mg = 1000
peso_abate_mg = 800000

# Multiplicador global sobre consumo e crescimento.
# Abaixo de 18 C para de comer; letal sustentado a 13 C.
[[crescimento.temperatura]]
graus = 13.0
multiplicador = 0.0
[[crescimento.temperatura]]
graus = 18.0
multiplicador = 0.05
[[crescimento.temperatura]]
graus = 22.0
multiplicador = 0.5
[[crescimento.temperatura]]
graus = 25.0
multiplicador = 0.7
[[crescimento.temperatura]]
graus = 27.0
multiplicador = 1.25
[[crescimento.temperatura]]
graus = 30.0
multiplicador = 1.4
[[crescimento.temperatura]]
graus = 33.0
multiplicador = 0.7

# Gontijo 2008, 25-26 C: % da biomassa por dia, por classe de peso.
[[arracoamento]]
ate_peso_mg = 5000
taxa_biomassa_pct = 25.0
tratos_dia = 6
proteina_pct = 40
[[arracoamento]]
ate_peso_mg = 30000
taxa_biomassa_pct = 10.0
tratos_dia = 5
proteina_pct = 36
[[arracoamento]]
ate_peso_mg = 175000
taxa_biomassa_pct = 4.0
tratos_dia = 4
proteina_pct = 36
[[arracoamento]]
ate_peso_mg = 350000
taxa_biomassa_pct = 3.0
tratos_dia = 3
proteina_pct = 32
[[arracoamento]]
ate_peso_mg = 1200000
taxa_biomassa_pct = 2.0
tratos_dia = 2
proteina_pct = 32

# O teto ambiental de racao e o coracao do trade-off densidade x oxigenio.
# Medido: 34 kg/ha/dia -> OD 4,5 e CAA 1,3 e sobrevivencia 99%
#         78 kg/ha/dia -> OD 2,1 e CAA 2,5 e sobrevivencia 83%
[agua]
temperatura_base_c = 27.0
temperatura_variacao_diaria_c = 4.0
temperatura_pico_hora = 15
od_variacao_diaria_ugl = 6000
od_base_ugl = 6000
od_consumo_por_kg_m3_ugl = 900
od_recuperacao_aerador_ugl = 2500
teto_racao_kg_ha_dia_sem_aeracao = 40.0
teto_racao_kg_ha_dia_com_aeracao = 120.0
od_ideal_min_ugl = 5000
od_ideal_max_ugl = 8000
od_para_alimentar_min_ugl = 3000
od_critico_ugl = 2000
od_letal_ugl = 1000
od_pico_hora = 17
od_minimo_hora = 6
secchi_ideal_min_cm = 30
secchi_ideal_max_cm = 50
secchi_letal_cm = 12

# Fracao de amonia nao-ionizada (a toxica) por pH, a 28 C.
# 2 ppm de amonia total a pH 7 e inocuo; a pH 9 e letal.
[[agua.amonia_por_ph]]
ph = 7.0
fracao_toxica_pct = 0.73
[[agua.amonia_por_ph]]
ph = 7.5
fracao_toxica_pct = 2.2
[[agua.amonia_por_ph]]
ph = 8.0
fracao_toxica_pct = 6.9
[[agua.amonia_por_ph]]
ph = 8.5
fracao_toxica_pct = 19.6
[[agua.amonia_por_ph]]
ph = 9.0
fracao_toxica_pct = 45.0

# Sobrevive a 0,4-0,7 mg/L por 3-5 h: a hipoxia mata por tempo acumulado, nao instantaneamente.
[mortalidade]
sobrevivencia_engorda_pct = 80.0
horas_para_letal_em_hipoxia = 4.0
hipoxia_perda_por_tick_pct = 0.3
fome_dias_ate_perda = 3.0
fome_perda_diaria_pct = 2.0

# Estreptococose acima de 27 C, francisellose abaixo de 25 C: calendarios opostos.
[[doencas]]
