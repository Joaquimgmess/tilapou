# CEPEA fev/2026: R$ 8,69-10,39/kg na fazenda. Racao e 64-80% do custo.
# Equivalencia peixe-racao = preco / (CAA * preco_racao): <1,25 inviavel, >2,00 excelente.
[economia]
preco_peixe_tc_kg = 900
preco_racao_tc_kg = 320
custo_alevino_tc = 35
caa_referencia = 1.6
custo_energia_aerador_tc_hora = 12

# Escada classica: custo base * 1.15^n. Marcos de x2 acumulativos.
[progressao]
fator_custo = 1.15
marcos_x2 = [10, 25, 50, 100, 200]
prestigio_divisor = 1000000
prestigio_bonus_por_unidade_pct = 5.0

[[automacao]]
