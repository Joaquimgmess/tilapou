version = 1

# Oreochromis niloticus.
# ganho_dia = [(raiz3(W) + tgc*t_ref)^3 - W] * mult(temperatura) * (1 - W/peso_maximo)
# Calibrado contra dados de campo (validado em teste):
#   140 d a 22 C -> 44 g   (medido 49)
#   140 d a 30 C -> 389 g  (medido 398)
#   GPD a 28 C: 0,66 (10 g), 2,80 (100 g), 4,93 (400 g), 3,35 (800 g)
#   ciclo 30 g -> 800 g: 199 d a 28 C, 185 d a 30 C, 516 d a 22 C, inviavel abaixo de 20 C
[crescimento]
tgc = 0.0014
temperatura_referencia_c = 26.0
peso_maximo_mg = 1100000
peso_alevino_mg = 30000
# 800000 e o topo da classe de 100%: esperar ate la custa 100 dias a mais para receber o
# mesmo preco por quilo. Em 600000 o primeiro faturamento cai de 112h para 74h reais e a
# margem por dia sobe de 2410 para 3502; segurar ate 900 g continua sendo a jogada boa.
peso_abate_mg = 600000

# Multiplicador global sobre consumo e crescimento.
# Abaixo de 18 C para de comer; letal sustentado a 13 C.
[[crescimento.temperatura]]
graus = 13.0
multiplicador = 0.0
[[crescimento.temperatura]]
graus = 18.0
multiplicador = 0.05
[[crescimento.temperatura]]
graus = 22.0
multiplicador = 0.5
[[crescimento.temperatura]]
graus = 25.0
multiplicador = 0.7
[[crescimento.temperatura]]
graus = 27.0
multiplicador = 1.25
[[crescimento.temperatura]]
graus = 30.0
multiplicador = 1.4
[[crescimento.temperatura]]
graus = 33.0
multiplicador = 0.7

