version: "2"

linters:
  default: all
  disable:
    - dupword
    - exhaustruct
    - funlen
    - gochecknoglobals
    - godot
    - godox
    - ireturn
    - lll
    - nlreturn
    - nonamedreturns
    - noinlineerr
    - varnamelen
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 15
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: false
    depguard:
      rules:
        sim-puro:
          files:
            - "**/internal/sim/*.go"
          deny:
            - pkg: time
              desc: sim usa Tick inteiro; time.Now quebra determinismo
            - pkg: context
              desc: sim nao faz I/O; use StepBudget para limitar trabalho
            - pkg: os
              desc: sim e puro
            - pkg: net/http
              desc: sim e puro
            - pkg: database/sql
              desc: sim e puro
            - pkg: log
              desc: sim e puro
            - pkg: log/slog
              desc: sim e puro
            - pkg: math/rand
              desc: use math/rand/v2 com PCG derivado de semente e tick
            - pkg: github.com/Joaquimgmess/tilapou/internal/platform
              desc: sim nao depende de nada do projeto
            - pkg: github.com/Joaquimgmess/tilapou/internal/farm
              desc: sim nao depende de nada do projeto
            - pkg: github.com/Joaquimgmess/tilapou/internal/player
              desc: sim nao depende de nada do projeto
            - pkg: github.com/Joaquimgmess/tilapou/internal/balance
              desc: balance e passado como argumento, nao importado
        tui-sem-regra-de-jogo:
          files:
            - "**/internal/tui/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/Joaquimgmess/tilapou/internal/sim
              desc: a TUI nao calcula nada; ela desenha o snapshot do servidor
            - pkg: github.com/Joaquimgmess/tilapou/internal/farm
              desc: a TUI fala com o daemon pelo client, nao com o slice
            - pkg: github.com/Joaquimgmess/tilapou/internal/platform/postgres
              desc: a TUI nao toca no banco
            - pkg: database/sql
              desc: a TUI nao toca no banco
            - pkg: net/http
              desc: HTTP e responsabilidade do internal/client
        slices-nao-se-importam:
          files:
            - "**/internal/farm/**"
          deny:
            - pkg: github.com/Joaquimgmess/tilapou/internal/tui
              desc: slice nao conhece cliente
            - pkg: github.com/Joaquimgmess/tilapou/internal/client
              desc: slice nao conhece cliente
        client-so-transporte:
          files:
            - "**/internal/client/**"
          deny:
            - pkg: github.com/Joaquimgmess/tilapou/internal/sim
              desc: o client transporta DTO, nao roda simulacao
            - pkg: github.com/Joaquimgmess/tilapou/internal/farm
              desc: o client fala HTTP, nao chama o slice direto
    gocognit:
      min-complexity: 25
    gocritic:
      enabled-tags:
        - diagnostic
        - opinionated
        - performance
        - style
      disabled-checks:
        - hugeParam
    gosec:
      excludes:
        - G404
    govet:
      enable-all: true
      disable:
        - fieldalignment
    interfacebloat:
      max: 6
    misspell:
      ignore-rules:
        - comando
        - cenario
        - racao
        - automatico
        - automatica
    nakedret:
      max-func-lines: 0
    revive:
      enable-all-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: comment-spacings
          disabled: true
        - name: add-constant
          disabled: true
        - name: cognitive-complexity
          arguments: [25]
        - name: cyclomatic
          arguments: [15]
        - name: function-length
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: confusing-naming
          disabled: true
        - name: enforce-switch-style
          disabled: true
        - name: unhandled-error
          arguments:
            - fmt.Fprintf
            - fmt.Fprint
            - fmt.Fprintln
            - strings.Builder.WriteString
            - strings.Builder.WriteByte
            - strings.Builder.Write
    staticcheck:
      checks:
        - all
        - -S1016
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022
    tagliatelle:
      case:
        rules:
          json: snake
    testpackage:
      skip-regexp: (export|internal)_test\.go
    wrapcheck:
      ignore-package-globs:
        - github.com/Joaquimgmess/tilapou/*
      ignore-interface-regexps:
        - ^Store$
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: internal/sim/
        linters:
          - gosec
          - mnd
      - path: internal/balance/
        text: "G115:"
        linters:
          - gosec
      - path: internal/farm/
        text: "G115:"
        linters:
          - gosec
      - path: cmd/tilapou/serve\.go
        text: "G704:"
        linters:
          - gosec
      - path: cmd/api/main\.go
        text: "G704:"
        linters:
          - gosec
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - dupl
          - err113
          - forcetypeassert
          - gochecknoinits
          - maintidx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Joaquimgmess/tilapou
